[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "face-detection-app"
version = "1.1.0"
description = "Real-time face detection with YuNet/Haar backends, IoU tracking, and privacy modes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sebby1770" }]
keywords = ["opencv", "face-detection", "yunet", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
headless = ["opencv-python-headless>=4.8.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
face-detection = "face_detection:main"

[project.urls]
Homepage = "https://github.com/Sebby1770/face-detection-app"
Repository = "https://github.com/Sebby1770/face-detection-app"

[tool.setuptools]
py-modules = [
    "face_detection",
    "detectors",
    "tracker",
    "analytics",
    "pose",
    "download_model",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
