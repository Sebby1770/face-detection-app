[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "face-detection-app"
version = "3.0.0"
description = "Faces — detect and redact faces, and take local attendance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seb Forbes" }]
dependencies = [
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy", "opencv-contrib-python-headless>=4.8"]

[project.scripts]
faces = "faces:main"
face-detection = "face_detection:main"
attendance = "attendance.cli:main"

[tool.setuptools]
py-modules = [
    "analytics",
    "batch",
    "detectors",
    "download_model",
    "face_detection",
    "faces",
    "main",
    "media",
    "pipeline",
    "pose",
    "tracker",
]

[tool.setuptools.packages.find]
include = ["attendance*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["."]
